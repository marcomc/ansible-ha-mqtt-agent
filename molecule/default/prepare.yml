---
- name: Prepare local ha-mqtt-agent fixture
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install fixture prerequisites
      ansible.builtin.apt:
        name:
          - git
        state: present
        update_cache: true

    - name: Copy local agent fixture
      ansible.builtin.copy:
        src: ../resources/upstream/
        dest: /usr/local/src/ha-mqtt-agent-fixture/
        mode: preserve

    - name: Create fixture probe trace directory
      ansible.builtin.file:
        path: /var/tmp/ha-mqtt-agent-probes
        state: directory
        mode: "0755"

    - name: Ensure fixture Raspberry Pi video group exists
      ansible.builtin.group:
        name: video
        state: present
        system: true

    - name: Install fixture Raspberry Pi firmware command
      ansible.builtin.copy:
        src: /usr/local/src/ha-mqtt-agent-fixture/scripts/vcgencmd-test
        dest: /usr/local/bin/vcgencmd
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Initialize fixture Git repository
      ansible.builtin.command:
        argv:
          - git
          - init
          - --initial-branch=main
      args:
        chdir: /usr/local/src/ha-mqtt-agent-fixture
      changed_when: true

    - name: Configure fixture Git identity
      ansible.builtin.command:
        argv:
          - git
          - config
          - "{{ item.key }}"
          - "{{ item.value }}"
      loop:
        - key: user.email
          value: fixture@example.invalid
        - key: user.name
          value: Molecule fixture
      args:
        chdir: /usr/local/src/ha-mqtt-agent-fixture
      changed_when: true

    - name: Commit fixture source
      ansible.builtin.command:
        argv:
          - git
          - add
          - .
      args:
        chdir: /usr/local/src/ha-mqtt-agent-fixture
      changed_when: true

    - name: Record fixture Git revision
      ansible.builtin.command:
        argv:
          - git
          - commit
          - -m
          - Fixture
      args:
        chdir: /usr/local/src/ha-mqtt-agent-fixture
      changed_when: true
