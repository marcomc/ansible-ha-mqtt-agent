---
- name: Prepare local ha-mqtt-agent fixture
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install fixture prerequisites
      ansible.builtin.apt:
        name:
          - git
        state: present
        update_cache: true

    - name: Copy local agent fixture
      ansible.builtin.copy:
        src: ../resources/upstream/
        dest: /usr/local/src/ha-mqtt-agent-fixture/
        mode: preserve

    - name: Initialize fixture Git repository
      ansible.builtin.command:
        argv:
          - git
          - init
          - --initial-branch=main
      args:
        chdir: /usr/local/src/ha-mqtt-agent-fixture
      changed_when: true

    - name: Configure fixture Git identity
      ansible.builtin.command:
        argv:
          - git
          - config
          - "{{ item.key }}"
          - "{{ item.value }}"
      loop:
        - key: user.email
          value: fixture@example.invalid
        - key: user.name
          value: Molecule fixture
      args:
        chdir: /usr/local/src/ha-mqtt-agent-fixture
      changed_when: true

    - name: Commit fixture source
      ansible.builtin.command:
        argv:
          - git
          - add
          - .
      args:
        chdir: /usr/local/src/ha-mqtt-agent-fixture
      changed_when: true

    - name: Record fixture Git revision
      ansible.builtin.command:
        argv:
          - git
          - commit
          - -m
          - Fixture
      args:
        chdir: /usr/local/src/ha-mqtt-agent-fixture
      changed_when: true
